[project]
name = "melcausalvae"
version = "0.1.0"
description = "Speech AE"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",

    "numpy==1.26.4",
    "soundfile",

    "transformers==5.0.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "torchdiffeq",
    "beartype",
    "torchcodec==0.7",

    "vocos==0.1.0",
]

[project.optional-dependencies]
training = [
    "deepspeed==0.18.4",
    "accelerate==1.13.0",
    "datasets==4.1.0",
    "speechbrain",
    "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git",
    "matplotlib",
    "wandb",
    "jiwer",
    "torchaudio_filters",
    "torchcrepe",
]
eval = [
    "faster_whisper",
    "speechbrain"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "data*"]
exclude = ["configs*", "evaluation*"]
