model:
  latent_dim: 64
  projection_hidden_dim: 256
  quantizer:
    type: vq_ema  # vq_ema | bsq | fsq
    dim: 64
    codebook_size: 1024
    decay: 0.99
    eps: 0.00001
    reset_dead_codes: true
    reset_every_forward: 10
    entropy_temperature: 1.0
  transformer:
    dim: 256
    heads: 4
    layers: 4
    ff_dim: 1024
    dropout: 0.1
    max_length: 2048
  diffusion:
    hidden_dim: 256
    layers: 3
    time_dim: 64
    sigma_min: 0.0
    sampling_steps: 20
    temperature: 1.0
  loss:
    flow: 1.0
    reconstruction_l1: 1.0
    reconstruction_l2: 1.0
    commitment: 0.25
    bsq_regularization: 0.1
data:
  format: parquet
  train_path: /scratch/piermel/datasets/dicodec/librispeech-dicodec-v2-ls-25
  train_partitions: [train_clean_100, train_clean_360]
  validation_path: null
  validation_partitions: []
  input: z  # z | z_sem (attributes.z_sem in Parquet)
  target: z  # same-frame reconstruction and next-frame prediction
  cache_dir: null
  key: z
  max_frames: 2048
  factory: null
  train_kwargs: {}
  validation_kwargs: null
training:
  output_dir: outputs/sm_quantizer
  batch_size: 8
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 0
  seed: 42
  device: auto
  log_every: 10
  save_every_steps: 1000  # null disables periodic saving; epoch-end saves remain
  max_steps: null
  resume: null
  wandb_mode: disabled  # online | offline | disabled
  wandb_project: dicodec-sm-quantizer
  wandb_run_name: null
  wandb_id: null
