# @package _global_
# 15-mel LibriTTS-R baseline with frozen ECAPA speaker conditioning and per-layer FiLM.
compress_factor: 4
mel_dim: 100
latent_dim: 64
sample_rate: 24000

training:
  enable_perturbed_audio: true
  perturbed_pitch_shift_max_semitones: 8.0

  
  num_train_epochs: 10
  dataset_name: libritts-r
  output_dir: checkpoints/exps/1_ecapa
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 8

  learning_rate: 1e-4
  encoder_lr: 3e-4
  decoder_lr: 1e-4
  encoder_warmup_ratio: 0.01
  decoder_warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  encoder_min_lr: 1.0e-4
  decoder_min_lr: 5.0e-5

  report_to: wandb
  wandb_project: speech-vae-paper
  wandb_run_name: 1_ecapa

  fp16: false
  bf16: true

  save_steps: 1000
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 5000
  save_total_limit: 3
  load_best_model_at_end: false
  metric_for_best_model: "avg_WER"
  greater_is_better: false
  early_stopping_patience: 5
  vq_collapse_threshold: 0.5
  vq_collapse_patience: 5

  gradient_accumulation_steps: 1
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 1
  dataloader_persistent_workers: true
  eval_num_samples: 100

wavlm_config:
  pretrained_model_name: "microsoft/wavlm-large"
  layer: 23
  sampling_rate: 16000
  normalize: true

encoder:
  d_model: 1024
  tf_heads: 8
  tf_layers: 4
  n_residual_blocks: 3
  logvar_layer: false
  target_std: 1.0
  kl_loss_warmup_ratio: 0.1
  kl_loss_weight: 1e-3
  use_reparameterization_trick: false
  use_std_sweep: false
  semantic_downsample_factor: 1

  vq_config: 
    num_embeddings: 128
    add_residual: true
    add_residual_p: 0.5
    vq_type: "bsq"
    commitment_weight: 1.0

  dropout_regularizer_config: null
  kl_chunk_regularizer_config: null
  noise_regularizer_config: null
  semantic_distillation_config: null

decoder:
  dit_dim: 768
  dit_depth: 6
  dit_heads: 12
  dit_dropout_rate: 0.1
  use_conv_layer: true
  uncond_prob: 0.15
  is_causal: true
  use_window_attention: true
  window_attention_seconds: 3
  kernel_size: 17
  causal_convolution: false
  normalize_context_vector: true
  speaker_cond_dim: 192

speaker_encoder_config:
  pretrained_model_name: /scratch/piermel/models/speechbrain/spkrec-ecapa-voxceleb
  sampling_rate: 16000
  embedding_dim: 192