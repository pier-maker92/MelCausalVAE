# @package _global_
compress_factor: 4
mel_dim: 100
latent_dim: 64
sample_rate: 24000

training:
  # dataset 
  num_train_epochs: 10
  dataset_name: libritts-r

  # bs
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 8

  # output 
  output_dir: checkpoints/exps/dicodec-18
  save_total_limit: 3

  # lr
  learning_rate: 1e-4
  encoder_lr: 3e-4
  decoder_lr: 1e-4
  encoder_warmup_ratio: 0.01
  decoder_warmup_ratio: 0.05
  lr_scheduler_type: cosine
  encoder_min_lr: 0.0001
  decoder_min_lr: 5.0e-05
  
  # logging
  report_to: wandb
  wandb_project: dicodec
  wandb_run_name: dicodec-18

  # precision
  fp16: false
  bf16: true

  # eval
  save_steps: 5000
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 5000
  load_best_model_at_end: false
  metric_for_best_model: eval_avg_dWER
  greater_is_better: false
  eval_num_samples: 100

  gradient_accumulation_steps: 1
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 1
  dataloader_persistent_workers: true

encoder:
  d_model: 128
  tf_heads: 8
  tf_layers: 4
  n_residual_blocks: 3
  logvar_layer: false
  target_std: 1.0
  kl_loss_warmup_ratio: 0.1
  kl_loss_weight: 1e-5
  use_reparameterization_trick: false
  use_std_sweep: true
  dropout_regularizer_config: null
  kl_chunk_regularizer_config: null
  noise_regularizer_config: null

decoder:
  dit_dim: 768
  dit_depth: 6
  dit_heads: 12
  dit_dropout_rate: 0.1
  use_conv_layer: true
  uncond_context_prob: 0.1
  uncond_speaker_prob: 0.1
  uncond_both_prob: 0.05
  is_causal: true
  use_window_attention: true
  window_attention_seconds: 3
  kernel_size: 17
  causal_convolution: false
  normalize_context_vector: true
  speaker_cond_dim: 1024
  adaln_cond_dim: 768
  local_speaker_conditioning: false

wavlm_module_config:
  pretrained_model_name: microsoft/wavlm-large
  feature_extractor_config:
    layer: 18
    sampling_rate: 16000
    normalize: true
  speaker_encoder_config:
    sampling_rate: 16000
    embedding_dim: 1024
    wavlm_layers:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    wavlm_layer_combine: weighted_sum
    wavlm_pooling: mean_std
    wavlm_layer_weights: null
    wavlm_normalize_features: true
    wavlm_freeze: true
    wavlm_attention_channels: 128
