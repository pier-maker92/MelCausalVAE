# @package _global_
defaults:
  - /settings/dicodec/18
  - _self_
compress_factor: 4
training:
  dataset_name: libritts-r
  max_audio_duration: 30
  num_train_epochs: 5
  per_device_train_batch_size: 12

  finetune_decoder: true
  # Required: pass training.from_pretrained=/path/to/checkpoint on the CLI.
  from_pretrained:  "/scratch/piermel/MelCausalVAE/checkpoints/paper/v2/ls/25"
  resume_from_checkpoint: null
  output_dir: checkpoints/exps/dicodec-18-decoder-ft
  wandb_run_name: 18-decoder-ft

  # Both speaker_encoder and decoder use the decoder LR and scheduler.
  decoder_lr: 1e-4
  decoder_min_lr: 5e-5
  decoder_warmup_ratio: 0.005

  # eval
  save_steps: 2500
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 2500
