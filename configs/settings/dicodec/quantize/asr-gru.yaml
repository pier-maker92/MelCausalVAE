# @package _global_
# Self-contained ASR BiLSTM + location-aware GRU experiment (pure PyTorch).
# run_job supplies a unique training.output_dir and training.wandb_run_name.
sm_quantizer:
  model:
    latent_dim: 64
    projection_hidden_dim: 256
    encoder:
      type: causal_conv
      hidden_dim: 512
      layers: 4
      kernel_size: 3
      dropout: 0.0
    language_modeling: false
    simple_reconstruction: false
    asr:
      enabled: true
      type: gru
      quantizer_position: before_encoder
      encoder_hidden_size: 512
      encoder_layers: 4
      decoder_hidden_size: 512
      decoder_layers: 2
      decoder_embedding_dim: 256
      attention_dim: 256
      attention_channels: 10
      attention_kernel_size: 100  # radius; effective convolution width 201
      attention_scaling: 1.0
      max_audio_length: 2048
      max_text_length: 1024
      max_decode_length: 512
      label_smoothing: 0.0
      dropout: 0.1
      embedding_dim: 256
      upsample_factor: 1
      tokenizer: char
      characters: 'abcdefghijklmnopqrstuvwxyz'' '
      tokenizer_model: null
      vocab_size: 1000
    quantizer:
      type: vq_ema
      dim: 64
      codebook_size: 1024
      decay: 0.99
      eps: 1.0e-05
      reset_dead_codes: true
      reset_every_forward: 100
      entropy_temperature: 100.0
    from_pretrained: null
    transformer:
      dim: 256
      heads: 4
      layers: 4
      ff_dim: 1024
      dropout: 0.1
      max_length: 2048
    diffusion:
      hidden_dim: 256
      layers: 3
      time_dim: 64
      sigma_min: 0.0
      sampling_steps: 20
      temperature: 1.0
    loss:
      flow: 0.0
      reconstruction_l1: 0.0
      reconstruction_l2: 0.0
      commitment: 0.25
      codebook: 1.0
      bsq_regularization: 0.1
      asr: 1.0
  data:
    train_path: ${oc.env:SLURM_TMPDIR}/datasets/dicodec/${training.dataset_name}
    validation_path: null
    key: z
    format: parquet
    input: z_sem
    target: z_sem
    text_key: transcript
    train_partitions:
    - train_clean_100
    - train_clean_360
    validation_partitions: []
    cache_dir: ${oc.env:SLURM_TMPDIR}/sm_quantizer_arrow_cache
    max_frames: 2048
    factory: null
    train_kwargs: {}
    validation_kwargs: null
  training:
    output_dir: ${training.output_dir}
    batch_size: 64
    epochs: 10
    learning_rate: 0.0003
    weight_decay: 0.01
    grad_clip: 1.0
    num_workers: 4
    seed: 42
    device: cuda
    log_every: 10
    save_every_steps: 1000
    max_save_limit: 3
    max_steps: null
    resume: null
    wandb_mode: online
    wandb_project: dicodec-sm-quantizer
    wandb_run_name: ${training.wandb_run_name}
    wandb_id: null
training:
  dataset_name: librispeech-dicodec-v2-ls-6.25
  output_dir: outputs/sm_quantizer/asr-gru
  bf16: false
  fp16: false
