# @package _global_
# run_job supplies training.dataset_name and a unique training.output_dir.
training:
  dataset_name: librispeech-dicodec-v2-ls-25
  output_dir: outputs/sm_quantizer/ema1024-zsem
  bf16: false
  fp16: false

sm_quantizer:
  model:
    latent_dim: 64
    projection_hidden_dim: 256
    quantizer:
      type: vq_ema
      dim: 64
      codebook_size: 1024
      decay: 0.99
      eps: 0.00001
      reset_dead_codes: true
      reset_every_forward: 10
    transformer:
      dim: 256
      heads: 4
      layers: 4
      ff_dim: 1024
      dropout: 0.1
      max_length: 2048
    diffusion:
      hidden_dim: 256
      layers: 3
      time_dim: 64
      sigma_min: 0.0
      sampling_steps: 20
      temperature: 1.0
    loss:
      flow: 1.0
      reconstruction_l1: 1.0
      reconstruction_l2: 1.0
      commitment: 0.25
  data:
    format: parquet
    # copy_dataset.sh stages dataset_path = dicodec/<dataset_name> here.
    train_path: ${oc.env:SLURM_TMPDIR}/datasets/dicodec/${training.dataset_name}
    train_partitions: [train_clean_100]
    validation_path: null
    validation_partitions: []
    input: z_sem
    target: z_sem
    max_frames: 2048
    cache_dir: ${oc.env:SLURM_TMPDIR}/sm_quantizer_arrow_cache
  training:
    output_dir: ${training.output_dir}
    batch_size: 8
    epochs: 100
    learning_rate: 0.0003
    weight_decay: 0.01
    grad_clip: 1.0
    num_workers: 0
    seed: 42
    device: cuda
    log_every: 10
    max_steps: null
    resume: null
