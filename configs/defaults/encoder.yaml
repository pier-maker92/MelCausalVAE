# @package _global_
encoder:
  d_model: 512
  tf_heads: 8
  tf_layers: 4
  drop_p: 0.1
  n_residual_blocks: 3
  freeze_encoder_before_latent_heads: false
  
  logvar_layer: true
  kl_loss_weight: 1.0e-3
  target_std: null
  kl_loss_warmup_steps: 1000
  kl_loss_warmup_ratio: null
  use_slt: false
  use_softplus: false
  use_reparameterization_trick: false
  use_instance_norm: false
  semantic_downsample_factor: 1
  semantic_dim: null
  acoustic_dim: null
  acoustic_logvar: false

  # --- VQ ---
  vq_config:
    num_embeddings: null
    add_residual: false
    add_residual_p: 0.0
    vq_dim: 128
    entropy_loss_weight: 0.0
    dim_to_quantize: null
    recon_weight: null
    drop_acoustic_p: 0.0

  vq_acoustic_config: null

  pitch_loss_config: null
