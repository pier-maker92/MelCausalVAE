# @package _global_
training:
  output_dir: null
  num_train_epochs: null
  per_device_train_batch_size: null
  gradient_accumulation_steps: 1
  
  # Learning Rates
  learning_rate: 1e-4
  encoder_lr: null
  decoder_lr: null
  min_learning_rate: 0.0
  encoder_min_lr: null
  decoder_min_lr: null
  
  # Scheduler
  lr_scheduler_type: "constant"
  warmup_ratio: 0.0
  warmup_steps: 0
  encoder_warmup_ratio: null
  decoder_warmup_ratio: null
  
  # Training loop
  max_grad_norm: 1.0
  save_steps: null
  eval_steps: null
  eval_strategy: "steps"
  logging_steps: 1
  seed: 42 
  
  # Hardware / Data
  bf16: true
  fp16: false
  dataloader_num_workers: 0
  dataloader_prefetch_factor: 1
  dataloader_persistent_workers: true
  dataloader_pin_memory: false
  dataloader_drop_last: true
  per_device_eval_batch_size: 1
  
  # WandB / Logging
  report_to: none
  wandb_project: null
  wandb_run_name: null
  wandb_id: null
  
  # Dataset / Dicodec specifics
  resume_from_checkpoint: null
  from_pretrained: null
  dataset_name: null
  max_audio_duration: null
  eval_num_samples: null
